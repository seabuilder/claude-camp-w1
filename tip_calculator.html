<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>班次薪酬计算 — 护理工具中心</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #faf6f3 0%, #f5ede5 100%);
      min-height: 100vh; color: #2d2d2d;
    }
    .nav { padding: 16px 28px; background: linear-gradient(135deg, #e8b4cc 0%, #dfa0c0 100%); }
    .nav a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 0.92rem; font-weight: 600; }

    .page-header { text-align: center; padding: 36px 20px 20px; }
    .page-header .icon { font-size: 2.8rem; margin-bottom: 8px; }
    .page-header h1 { font-size: 1.9rem; font-weight: 800; color: #d47fa0; font-family: 'Patrick Hand','Nunito',sans-serif; margin-bottom: 4px; }
    .page-header p { font-size: 0.95rem; color: #6e6e73; }

    .main { max-width: 600px; margin: 0 auto; padding: 0 18px 80px; }

    /* Card */
    .card {
      background: #fff; border-radius: 18px; padding: 22px 24px;
      box-shadow: 0 4px 20px rgba(232,180,204,0.13);
      border: 2px solid rgba(232,180,204,0.12); margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.75rem; font-weight: 700; color: #dfa0c0;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 16px;
    }

    /* Fields */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 0.8rem; font-weight: 700; color: #9b7e8e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 10px 13px;
      border: 2px solid rgba(232,180,204,0.35); border-radius: 11px;
      font-size: 0.97rem; color: #2d2d2d; background: #fff;
      transition: border-color 0.2s; font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: #dfa0c0; box-shadow: 0 0 0 3px rgba(223,160,192,0.1); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* Rate prefix input */
    .input-prefix { position: relative; }
    .input-prefix span {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-weight: 700; color: #d47fa0; font-size: 1rem; pointer-events: none;
    }
    .input-prefix input { padding-left: 26px; }

    /* Rate preview grid */
    .rate-preview {
      display: none; background: linear-gradient(135deg,#fff9fb,#fff2f8);
      border-radius: 12px; padding: 14px 16px; margin-top: 12px;
      border: 1px solid rgba(232,180,204,0.2);
    }
    .rate-preview.show { display: block; }
    .rate-preview-title { font-size: 0.72rem; font-weight: 700; color: #dfa0c0; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .rate-rows .rr { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 4px 0; border-bottom: 1px solid rgba(232,180,204,0.1); }
    .rate-rows .rr:last-child { border-bottom: none; }
    .rr-label { color: #6e6e73; }
    .rr-val { font-weight: 700; color: #2d2d2d; }

    /* Toggle */
    .toggle-group { display: flex; background: #f0e8ed; border-radius: 10px; padding: 3px; }
    .toggle-btn {
      flex: 1; padding: 8px 0; border: none; border-radius: 7px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      background: transparent; color: #9b7e8e; transition: all 0.2s; font-family: inherit;
    }
    .toggle-btn.active { background: #fff; color: #d47fa0; box-shadow: 0 2px 8px rgba(232,180,204,0.3); }

    /* Duration badge */
    .duration-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(232,180,204,0.15); border-radius: 16px;
      padding: 5px 12px; font-size: 0.84rem; font-weight: 600; color: #d47fa0;
      margin-top: 10px;
    }

    /* Add shift button */
    .add-btn {
      width: 100%; padding: 13px; background: linear-gradient(135deg,#e8b4cc,#dfa0c0);
      color: #fff; border: none; border-radius: 14px; font-size: 0.97rem; font-weight: 700;
      cursor: pointer; transition: all 0.22s; font-family: inherit; margin-bottom: 14px;
    }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,180,204,0.4); }

    /* Shift log */
    .shift-log { display: none; }
    .shift-log.show { display: block; }
    .log-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .log-header .log-title { font-size: 0.75rem; font-weight: 700; color: #dfa0c0; text-transform: uppercase; letter-spacing: 0.07em; }
    .clear-btn {
      font-size: 0.78rem; font-weight: 600; color: #bbb; background: none;
      border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: color 0.2s;
    }
    .clear-btn:hover { color: #d47fa0; }

    /* Shift entry */
    .shift-entry {
      background: #fff; border-radius: 14px; padding: 14px 16px;
      border: 2px solid rgba(232,180,204,0.12); margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 10px rgba(232,180,204,0.08);
    }
    .entry-num {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg,#e8b4cc,#dfa0c0); color: #fff;
      font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .entry-info { flex: 1; min-width: 0; }
    .entry-top { font-size: 0.88rem; font-weight: 600; color: #2d2d2d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-sub { font-size: 0.78rem; color: #9b7e8e; margin-top: 2px; }
    .entry-pay { font-size: 1rem; font-weight: 800; color: #d47fa0; white-space: nowrap; }
    .entry-del {
      background: none; border: none; color: #ddd; cursor: pointer; font-size: 1rem;
      padding: 4px; border-radius: 6px; transition: color 0.2s; flex-shrink: 0;
    }
    .entry-del:hover { color: #e88; }

    /* Summary */
    .summary-card {
      display: none; background: linear-gradient(135deg,#e8b4cc,#dfa0c0);
      border-radius: 18px; padding: 22px 24px; color: #fff; margin-bottom: 14px;
    }
    .summary-card.show { display: block; animation: slideIn 0.35s ease; }
    @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .summary-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .summary-label { font-size: 0.82rem; opacity: 0.85; margin-bottom: 2px; }
    .summary-total { font-size: 2.4rem; font-weight: 800; }
    .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .s-item { background: rgba(255,255,255,0.18); border-radius: 10px; padding: 10px 12px; }
    .s-item .s-label { font-size: 0.72rem; opacity: 0.85; margin-bottom: 3px; }
    .s-item .s-value { font-size: 1rem; font-weight: 700; }
    .summary-detail { margin-top: 14px; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 14px; }
    .sd-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .sd-row:last-child { border-bottom: none; }

    .no-rate-msg { text-align: center; color: #dfa0c0; font-size: 0.88rem; padding: 8px 0; }
  </style>
</head>
<body>

<div class="nav">
  <a href="index.html">← 返回护理工具中心</a>
</div>

<div class="page-header">
  <div class="icon">👩‍⚕️</div>
  <h1>班次薪酬计算</h1>
  <p>支持多班次累计，自动计算两周或月度总薪酬</p>
</div>

<div class="main">

  <!-- ① Pay Rate -->
  <div class="card">
    <div class="card-title">💰 时薪设置 Pay Rate</div>
    <div class="field">
      <label>基本时薪 Base Hourly Rate ($/hr)</label>
      <div class="input-prefix">
        <span>$</span>
        <input type="number" id="baseRate" placeholder="输入你的基本时薪" step="0.01" min="0" oninput="updateRates()" />
      </div>
    </div>
    <div class="rate-preview" id="ratePreview">
      <div class="rate-preview-title">自动计算费率 Auto-calculated Rates</div>
      <div class="rate-rows" id="rateRows"></div>
    </div>
  </div>

  <!-- ② Shift + Break (merged) -->
  <div class="card">
    <div class="card-title">🕐 班次 &amp; 休息时间 Shift &amp; Break</div>

    <div class="grid-2">
      <div class="field">
        <label>上班时间 Start</label>
        <input type="time" id="startTime" value="07:00" oninput="updateDuration()" />
      </div>
      <div class="field">
        <label>下班时间 End</label>
        <input type="time" id="endTime" value="15:30" oninput="updateDuration()" />
      </div>
    </div>

    <div class="grid-3" style="margin-top:4px;">
      <div class="field" style="grid-column:span 1;">
        <label>Break <span style="font-size:0.7rem;background:rgba(232,180,204,0.25);color:#d47fa0;border-radius:5px;padding:1px 5px;">Unpaid = Default</span></label>
        <div class="toggle-group">
          <button class="toggle-btn active" id="btn-unpaid" onclick="setBreak('unpaid')">Unpaid</button>
          <button class="toggle-btn"        id="btn-paid"   onclick="setBreak('paid')">Paid</button>
        </div>
      </div>
      <div class="field">
        <label>时长 Duration</label>
        <input type="number" id="breakMins" value="30" min="0" max="120" step="5" oninput="updateDuration()" style="text-align:center;" />
      </div>
      <div class="field">
        <label>班次实付时长</label>
        <div class="duration-badge" id="durationBadge" style="margin-top:2px;width:100%;justify-content:center;">— hr</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>工作日 Day</label>
        <select id="dayType" onchange="updateShiftOptions()">
          <option value="monday">Monday</option>
          <option value="tuesday">Tuesday</option>
          <option value="wednesday">Wednesday</option>
          <option value="thursday">Thursday</option>
          <option value="friday">Friday</option>
          <option value="saturday">Saturday（Straight 150%）</option>
          <option value="sunday">Sunday（Straight 175%）</option>
        </select>
      </div>
      <div class="field">
        <label>班次 Shift</label>
        <select id="shiftType">
          <option value="day">Day Shift（100%）</option>
          <option value="afternoon">Afternoon Shift（+15%，Mon–Fri only）</option>
          <option value="night">Night Shift（175%，Mon–Fri only）</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>备注 Note（可选）</label>
      <input type="text" id="shiftNote" placeholder="e.g. Ward 3, Mon 19 May..." />
    </div>
  </div>

  <button class="add-btn" onclick="addShift()">＋ 添加本班次 Add Shift</button>

  <!-- Shift log -->
  <div class="shift-log" id="shiftLog">
    <div class="log-header">
      <div class="log-title" id="logTitle">班次记录 Shift Log</div>
      <button class="clear-btn" onclick="clearAll()">清空 Clear All</button>
    </div>
    <div id="logEntries"></div>
  </div>

  <!-- Summary -->
  <div class="summary-card" id="summaryCard">
    <div class="summary-top">
      <div>
        <div class="summary-label">累计总薪酬 Total Gross Pay</div>
        <div class="summary-total" id="sTotal">$0.00</div>
      </div>
      <div style="text-align:right;">
        <div class="summary-label" id="sShiftCount"></div>
        <div style="font-size:1.1rem;font-weight:700;" id="sTotalHours"></div>
      </div>
    </div>
    <div class="summary-grid">
      <div class="s-item"><div class="s-label">标准薪酬</div><div class="s-value" id="sStandard">$0</div></div>
      <div class="s-item"><div class="s-label">加班费 OT</div><div class="s-value" id="sOT">$0</div></div>
      <div class="s-item"><div class="s-label">Allowances</div><div class="s-value" id="sAllowance">$0</div></div>
    </div>
    <div class="summary-detail" id="sBreakdown"></div>

    <!-- Export button -->
    <button onclick="exportPDF()" style="
      margin-top:16px; width:100%; padding:13px; border:2px solid rgba(255,255,255,0.5);
      border-radius:14px; background:rgba(255,255,255,0.15); color:#fff;
      font-size:0.97rem; font-weight:700; cursor:pointer; font-family:inherit;
      transition:background 0.2s; display:flex; align-items:center; justify-content:center; gap:8px;">
      🖨️ 导出 / 打印 PDF — Payroll Verification Report
    </button>
  </div>

</div>

<script>
  // ── State ─────────────────────────────────────────────────────────
  let breakMode = 'unpaid';
  let shifts = []; // { label, dayType, shiftType, paidHrs, standardPay, ot1Pay, ot2Pay, laundry, total }

  // ── Constants ─────────────────────────────────────────────────────
  const WEEKDAYS      = ['monday','tuesday','wednesday','thursday','friday'];
  const DAY_LOADING   = {
    monday:1.00, tuesday:1.00, wednesday:1.00, thursday:1.00, friday:1.00,
    saturday:1.50, sunday:1.75,
  };
  const AFTERNOON_ADD = 0.15;
  const OT_THRESHOLD  = 8;
  const OT1_MAX       = 2;
  const OT1_MULT      = 1.50;
  const OT2_MULT      = 2.00;
  const LAUNDRY       = 0.32;

  function getBase() { return parseFloat(document.getElementById('baseRate').value) || 0; }

  // ── Rates display ─────────────────────────────────────────────────
  function updateRates() {
    const base = getBase();
    const preview = document.getElementById('ratePreview');
    if (!base || base <= 0) { preview.classList.remove('show'); return; }
    preview.classList.add('show');

    const rates = [
      ['Mon–Fri Day (100%)',          base * 1.00],
      ['Mon–Fri Afternoon (115%)',    base * 1.15],
      ['Mon–Fri Night Shift (175%)',  base * 1.75],
      ['Saturday — Straight (150%)', base * 1.50],
      ['Sunday — Straight (175%)',   base * 1.75],
      ['Overtime 150%',              base * OT1_MULT],
      ['Overtime 200%',              base * OT2_MULT],
    ];

    document.getElementById('rateRows').innerHTML = rates
      .map(([label, rate]) =>
        `<div class="rr"><span class="rr-label">${label}</span><span class="rr-val">$${rate.toFixed(2)}/hr</span></div>`)
      .join('');
  }

  // ── Break toggle ──────────────────────────────────────────────────
  function setBreak(mode) {
    breakMode = mode;
    document.getElementById('btn-unpaid').classList.toggle('active', mode === 'unpaid');
    document.getElementById('btn-paid').classList.toggle('active', mode === 'paid');
    updateDuration();
  }

  // ── Duration badge ────────────────────────────────────────────────
  function getRawHours() {
    const s = document.getElementById('startTime').value;
    const e = document.getElementById('endTime').value;
    if (!s || !e) return null;
    const [sh, sm] = s.split(':').map(Number);
    const [eh, em] = e.split(':').map(Number);
    let mins = (eh * 60 + em) - (sh * 60 + sm);
    if (mins <= 0) mins += 1440;
    return mins / 60;
  }

  function updateDuration() {
    const raw = getRawHours();
    const badge = document.getElementById('durationBadge');
    if (!raw) { badge.textContent = '— hr'; return; }
    const breakH = (parseInt(document.getElementById('breakMins').value) || 0) / 60;
    const paid   = breakMode === 'unpaid' ? raw - breakH : raw;
    const h = Math.floor(paid), m = Math.round((paid - h) * 60);
    badge.textContent = `${h}h ${m > 0 ? m + 'm' : ''}`.trim();
  }

  // ── Calculate one shift ───────────────────────────────────────────
  function calcShift(base, paidHrs, dayType, shiftType) {
    const isWeekday  = WEEKDAYS.includes(dayType);
    let shiftRate;
    if (!isWeekday) {
      shiftRate = base * DAY_LOADING[dayType]; // Sat/Sun straight rate
    } else if (shiftType === 'night') {
      shiftRate = base * 1.75;
    } else if (shiftType === 'afternoon') {
      shiftRate = base * (1.00 + AFTERNOON_ADD);
    } else {
      shiftRate = base * 1.00;
    }
    const standardH  = Math.min(paidHrs, OT_THRESHOLD);
    const otHrs      = Math.max(0, paidHrs - OT_THRESHOLD);
    const ot1H       = Math.min(otHrs, OT1_MAX);
    const ot2H       = Math.max(0, otHrs - OT1_MAX);
    return {
      shiftRate,
      standardPay : standardH  * shiftRate,
      ot1Pay      : ot1H       * base * OT1_MULT,
      ot2Pay      : ot2H       * base * OT2_MULT,
      laundry     : LAUNDRY,
      standardH, ot1H, ot2H,
    };
  }

  // ── Add shift ─────────────────────────────────────────────────────
  function addShift() {
    const base = getBase();
    if (!base || base <= 0) { alert('请先输入基本时薪 Base Hourly Rate'); return; }

    const raw = getRawHours();
    if (!raw || raw <= 0) { alert('请输入有效的上下班时间'); return; }

    const breakH  = (parseInt(document.getElementById('breakMins').value) || 0) / 60;
    const paidHrs = breakMode === 'unpaid' ? raw - breakH : raw;
    if (paidHrs <= 0) { alert('实付时长不能为零，请检查时间设置'); return; }

    const dayType   = document.getElementById('dayType').value;
    const shiftType = document.getElementById('shiftType').value;
    const note      = document.getElementById('shiftNote').value.trim();
    const c         = calcShift(base, paidHrs, dayType, shiftType);
    const total     = c.standardPay + c.ot1Pay + c.ot2Pay + c.laundry;

    const DAY_NAMES  = { monday:'Monday', tuesday:'Tuesday', wednesday:'Wednesday', thursday:'Thursday', friday:'Friday', saturday:'Saturday', sunday:'Sunday' };
    const dayLabel   = DAY_NAMES[dayType];
    const shiftLabel = { day:'Day', afternoon:'Afternoon', night:'Night' }[shiftType];
    const startV     = document.getElementById('startTime').value;
    const endV       = document.getElementById('endTime').value;
    const breakLabel = breakMode === 'unpaid' ? `Unpaid break ${document.getElementById('breakMins').value}min` : `Paid break`;

    shifts.push({ dayLabel, shiftLabel, startV, endV, paidHrs, c, total, note, breakLabel, dayType, shiftType });
    renderLog();
    renderSummary();
  }

  // ── Render log ────────────────────────────────────────────────────
  function renderLog() {
    const log = document.getElementById('shiftLog');
    const entries = document.getElementById('logEntries');
    if (shifts.length === 0) { log.classList.remove('show'); return; }
    log.classList.add('show');

    document.getElementById('logTitle').textContent =
      `班次记录 Shift Log（${shifts.length} 班次）`;

    entries.innerHTML = shifts.map((s, i) => {
      const h = Math.floor(s.paidHrs), m = Math.round((s.paidHrs - h) * 60);
      const paidStr = `${h}h${m > 0 ? m + 'm' : ''} paid`;
      const otStr = (s.c.ot1H + s.c.ot2H) > 0
        ? ` · OT ${(s.c.ot1H + s.c.ot2H).toFixed(2)}hr` : '';
      return `
        <div class="shift-entry">
          <div class="entry-num">${i + 1}</div>
          <div class="entry-info">
            <div class="entry-top">${s.dayLabel} ${s.shiftLabel}${s.note ? ' · ' + s.note : ''}</div>
            <div class="entry-sub">${s.startV} – ${s.endV} · ${paidStr}${otStr} · ${s.breakLabel}</div>
          </div>
          <div class="entry-pay">$${s.total.toFixed(2)}</div>
          <button class="entry-del" onclick="removeShift(${i})" title="删除">✕</button>
        </div>`;
    }).join('');
  }

  // ── Render summary ────────────────────────────────────────────────
  function renderSummary() {
    const card = document.getElementById('summaryCard');
    if (shifts.length === 0) { card.classList.remove('show'); return; }
    card.classList.add('show');

    const totalGross    = shifts.reduce((a, s) => a + s.total, 0);
    const totalHrs      = shifts.reduce((a, s) => a + s.paidHrs, 0);
    const totalStandard = shifts.reduce((a, s) => a + s.c.standardPay, 0);
    const totalOT       = shifts.reduce((a, s) => a + s.c.ot1Pay + s.c.ot2Pay, 0);
    const totalLaundry  = shifts.reduce((a, s) => a + s.c.laundry, 0);

    // Day-type breakdown
    const byDay = {};
    shifts.forEach(s => {
      const k = `${s.dayLabel} ${s.shiftLabel}`;
      if (!byDay[k]) byDay[k] = { total: 0, hrs: 0 };
      byDay[k].total += s.total;
      byDay[k].hrs   += s.paidHrs;
    });

    document.getElementById('sTotal').textContent   = `$${totalGross.toFixed(2)}`;
    document.getElementById('sShiftCount').textContent = `${shifts.length} 个班次`;
    document.getElementById('sTotalHours').textContent  = `${totalHrs.toFixed(2)} hrs paid`;
    document.getElementById('sStandard').textContent   = `$${totalStandard.toFixed(2)}`;
    document.getElementById('sOT').textContent         = `$${totalOT.toFixed(2)}`;
    document.getElementById('sAllowance').textContent  = `$${totalLaundry.toFixed(2)}`;

    document.getElementById('sBreakdown').innerHTML =
      Object.entries(byDay).map(([k, v]) =>
        `<div class="sd-row"><span>${k}</span><span>${v.hrs.toFixed(2)} hrs · $${v.total.toFixed(2)}</span></div>`
      ).join('') +
      `<div class="sd-row" style="font-weight:700;"><span>Total Gross</span><span>$${totalGross.toFixed(2)}</span></div>`;
  }

  // ── Remove / clear ────────────────────────────────────────────────
  function removeShift(i) {
    shifts.splice(i, 1);
    renderLog();
    renderSummary();
  }

  function clearAll() {
    if (!confirm('确认清空所有班次记录？')) return;
    shifts = [];
    renderLog();
    renderSummary();
  }

  // ── Export / Print PDF ───────────────────────────────────────────
  function exportPDF() {
    if (shifts.length === 0) { alert('请先添加班次记录'); return; }

    const base         = getBase();
    const totalGross   = shifts.reduce((a, s) => a + s.total, 0);
    const totalPaidHrs = shifts.reduce((a, s) => a + s.paidHrs, 0);
    const totalStd     = shifts.reduce((a, s) => a + s.c.standardPay, 0);
    const totalOT      = shifts.reduce((a, s) => a + s.c.ot1Pay + s.c.ot2Pay, 0);
    const totalLaundry = shifts.reduce((a, s) => a + s.c.laundry, 0);
    const generated    = new Date().toLocaleString('en-AU', { dateStyle:'long', timeStyle:'short' });

    function fmtHM(decHrs) {
      const h = Math.floor(decHrs), m = Math.round((decHrs - h) * 60);
      return m > 0 ? `${h}h ${m}m` : `${h}h`;
    }
    function rawHrsFromTimes(start, end) {
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let mins = (eh * 60 + em) - (sh * 60 + sm);
      if (mins <= 0) mins += 1440;
      return mins / 60;
    }

    const shiftRows = shifts.map((s, i) => {
      const isWkday   = WEEKDAYS.includes(s.dayType);
      const shiftAbbr = isWkday
        ? ({ day:'AM Shift', afternoon:'PM Shift', night:'Night Shift' }[s.shiftType])
        : 'Straight Rate';
      const rateDesc  = isWkday
        ? ({ day:'100%', afternoon:'115%', night:'175%' }[s.shiftType])
        : (s.dayType === 'saturday' ? 'Straight 150%' : 'Straight 175%');

      const rawHrs    = rawHrsFromTimes(s.startV, s.endV);
      const breakParts = s.breakLabel.match(/(\d+)min/);
      const breakMins  = breakParts ? parseInt(breakParts[1]) : 0;
      const breakType  = s.breakLabel.startsWith('Unpaid') ? 'Unpaid' : 'Paid';
      const hasOT      = s.c.ot1H > 0 || s.c.ot2H > 0;

      return `
        <tr>
          <td class="num">${i + 1}</td>
          <td>
            <div class="shift-name">${s.dayLabel} ${shiftAbbr}</div>
            ${s.note ? `<div class="meta-txt">${s.note}</div>` : ''}
          </td>
          <td>
            <div class="time-range">${s.startV} <span class="arrow">→</span> ${s.endV}</div>
            <div class="meta-txt">Total worked: ${fmtHM(rawHrs)}</div>
          </td>
          <td>
            <div>${breakType} break${breakMins > 0 ? ': ' + breakMins + ' min' : ''}</div>
            <div class="meta-txt">Paid: <strong>${fmtHM(s.paidHrs)}</strong></div>
          </td>
          <td>
            <div>$${base.toFixed(2)}/hr × ${rateDesc}</div>
            <div class="meta-txt">= <strong>$${s.c.shiftRate.toFixed(2)}/hr</strong></div>
          </td>
          <td class="pay-col">
            <div>Std (${fmtHM(s.c.standardH)}): $${s.c.standardPay.toFixed(2)}</div>
            ${hasOT ? `<div class="ot-line">${s.c.ot1H > 0 ? fmtHM(s.c.ot1H)+' × 150% = $'+s.c.ot1Pay.toFixed(2) : ''}${s.c.ot1H > 0 && s.c.ot2H > 0 ? '<br>' : ''}${s.c.ot2H > 0 ? fmtHM(s.c.ot2H)+' × 200% = $'+s.c.ot2Pay.toFixed(2) : ''}</div>` : ''}
            <div class="meta-txt">Laundry: $${s.c.laundry.toFixed(2)}</div>
            <div class="shift-total">$${s.total.toFixed(2)}</div>
          </td>
        </tr>`;
    }).join('');

    const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Payroll Verification Report</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; color: #1a1a1a; padding: 30px 36px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: flex-end;
              border-bottom: 2.5px solid #d47fa0; padding-bottom: 12px; margin-bottom: 20px; }
    .header h1 { font-size: 17px; color: #d47fa0; font-weight: 700; }
    .header .h-sub { font-size: 9px; color: #aaa; margin-top: 3px; }
    .header-right { text-align: right; font-size: 9.5px; color: #888; line-height: 1.8; }
    .header-right strong { color: #555; }

    /* Summary strip */
    .summary { display: flex; border: 1px solid #ecd8e5; border-radius: 8px;
               overflow: hidden; margin-bottom: 22px; }
    .s-box { flex: 1; padding: 11px 14px; border-right: 1px solid #ecd8e5; }
    .s-box:last-child { border-right: none; }
    .s-box .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.06em;
                  color: #b090a0; margin-bottom: 3px; }
    .s-box .val { font-size: 13px; font-weight: 700; color: #d47fa0; }
    .s-box .val.lg { font-size: 18px; }

    /* Table */
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    thead tr { background: #faf0f6; }
    th { padding: 8px 10px; text-align: left; font-size: 8px; font-weight: 700;
         text-transform: uppercase; letter-spacing: 0.06em; color: #c07090;
         border-bottom: 1.5px solid #ecd8e5; white-space: nowrap; }
    td { padding: 10px 10px; border-bottom: 1px solid #f2e4ec; vertical-align: top; line-height: 1.55; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #fdf8fb; }

    .num { color: #ccc; font-size: 9px; font-weight: 700; width: 22px; padding-top: 11px; }
    .shift-name { font-weight: 700; font-size: 11px; color: #1a1a1a; }
    .meta-txt { font-size: 9px; color: #999; margin-top: 2px; }
    .time-range { font-weight: 700; font-size: 11.5px; letter-spacing: 0.01em; }
    .time-range .arrow { color: #d47fa0; }
    .ot-line { font-size: 9px; color: #c07090; margin-top: 3px; font-style: italic; }
    .pay-col { border-left: 1.5px solid #ecd8e5; }
    .shift-total { font-size: 13px; font-weight: 700; color: #d47fa0;
                   margin-top: 6px; padding-top: 6px; border-top: 1px solid #ecd8e5; }

    /* Totals */
    .totals { width: 300px; margin-left: auto; margin-bottom: 20px;
              border: 1px solid #ecd8e5; border-radius: 8px; overflow: hidden; }
    .t-row { display: flex; justify-content: space-between; align-items: center;
             padding: 7px 14px; border-bottom: 1px solid #f2e4ec; font-size: 10px; }
    .t-row:last-child { border-bottom: none; }
    .t-row.grand { background: #faf0f6; font-weight: 700; font-size: 12px; color: #d47fa0; }
    .t-lbl { color: #666; }
    .t-val { font-weight: 600; }

    /* Footer */
    .footer { border-top: 1px solid #ecd8e5; padding-top: 10px;
              font-size: 8.5px; color: #bbb; line-height: 1.7; }
    .footer strong { color: #999; }

    @media print {
      body { padding: 0; }
      @page { margin: 1.4cm; size: A4 portrait; }
    }
  </style>
</head>
<body>

  <div class="header">

      <div><strong>Base rate:</strong> $${base.toFixed(2)}/hr &nbsp;|&nbsp; <strong>Shifts:</strong> ${shifts.length} &nbsp;|&nbsp; <strong>Total paid:</strong> ${fmtHM(totalPaidHrs)}</div>
    </div>

  <div class="summary">

    <div class="s-box"><div class="lbl">Standard Pay</div><div class="val">$${totalStd.toFixed(2)}</div></div>
    <div class="s-box"><div class="lbl">Overtime Pay</div><div class="val">$${totalOT.toFixed(2)}</div></div>
    <div class="s-box"><div class="lbl">Allowances</div><div class="val">$${totalLaundry.toFixed(2)}</div></div>
    <div class="s-box"><div class="lbl">Total Paid Hours</div><div class="val">${fmtHM(totalPaidHrs)}</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Shift</th>
        <th>Start → End &amp; Total Worked</th>
        <th>Break &amp; Paid Hours</th>
        <th>Rate Applied</th>
        <th>Pay Breakdown &amp; Shift Total</th>
      </tr>
    </thead>
    <tbody>${shiftRows}</tbody>
  </table>

  <div class="totals">
    <div class="t-row"><span class="t-lbl">Standard Pay</span><span class="t-val">$${totalStd.toFixed(2)}</span></div>
    <div class="t-row"><span class="t-lbl">Overtime Pay (150% + 200%)</span><span class="t-val">$${totalOT.toFixed(2)}</span></div>
    <div class="t-row"><span class="t-lbl">Laundry Allowance (${shifts.length} × $0.32)</span><span class="t-val">$${totalLaundry.toFixed(2)}</span></div>
    <div class="t-row grand"><span class="t-lbl">TOTAL GROSS PAY</span><span class="t-val">$${totalGross.toFixed(2)}</span></div>
  </div>

  <div class="footer">
    <strong>Rates:</strong>
    Mon–Fri AM Shift 100% &nbsp;·&nbsp; Mon–Fri PM Shift 115% &nbsp;·&nbsp; Mon–Fri Night Shift 175% &nbsp;·&nbsp;
    Saturday Straight 150% &nbsp;·&nbsp; Sunday Straight 175% &nbsp;·&nbsp;
    Overtime first 2hrs 150% &nbsp;·&nbsp; Overtime beyond 200% &nbsp;·&nbsp; Laundry $0.32/shift<br>
    本报告仅供薪酬核对参考。如发现差异，请联系 Payroll / Rostering 部门进行核实。
  </div>

  <script>window.onload = function(){ window.print(); }<\/script>
</body>
</html>`;

    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }

  // ── Weekend: disable afternoon option ────────────────────────────
  function updateShiftOptions() {
    const isWeekend = !WEEKDAYS.includes(document.getElementById('dayType').value);
    const shiftSel  = document.getElementById('shiftType');
    shiftSel.options[1].disabled = isWeekend; // Afternoon
    shiftSel.options[2].disabled = isWeekend; // Night
    if (isWeekend) shiftSel.value = 'day';
  }

  // ── Init ──────────────────────────────────────────────────────────
  updateDuration();
</script>
